name: Rebuild dist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit dist/index.html if it changed
        run: |
          if git diff --quiet -- dist/index.html; then
            echo "dist/index.html is already up to date."
            exit 0
          fi
          git config user.name "DNA64"
          git config user.email "4770097+DNA64@users.noreply.github.com"
          git add dist/index.html
          git commit -m "Rebuild dist/index.html"
          git push
