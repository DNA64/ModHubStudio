name: Publish site

# Rebuilds the Mod Hub site from packages/ and pushes it to the gh-pages
# branch whenever main changes. Set Settings → Pages to "Deploy from a
# branch", gh-pages, / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

env:
  PUBLISHER_REPO: DNA64/ModHubStudio
  PUBLISHER_REF: main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out the publisher
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLISHER_REPO }}
          ref: ${{ env.PUBLISHER_REF }}
          path: publisher

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the publisher
        working-directory: publisher
        run: npm ci --omit=dev

      - name: Build the site
        run: node publisher/ci/build-site.mjs --repo repo --out site

      - name: Push to gh-pages
        working-directory: site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
